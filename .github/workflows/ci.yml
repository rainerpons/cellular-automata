name: CI

on:
  push:
    branches: [ master, "stage-*" ]
  pull_request:
    branches: [ master, "stage-*" ]

jobs:
  verify:
    name: Verify Code
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Verify
      run: mvn clean verify

  package:
    name: Package Application
    needs: verify
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Package
      run: mvn package -DskipTests

    - name: Verify JAR Manifest Main-Class
      run: |
        unzip -p target/cellular-automata-*.jar META-INF/MANIFEST.MF | grep "Main-Class: com.cellularautomata.app.Main"
