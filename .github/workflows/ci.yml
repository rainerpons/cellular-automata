name: CI

on:
  push:
    branches: [ master, "stage-*" ]
  pull_request:
    branches: [ master, "stage-*" ]

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Check Formatting
      run: mvn fmt:check

  checkstyle:
    name: Check Style
    needs: format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Run Checkstyle
      run: mvn checkstyle:check

  spotbugs:
    name: Run SpotBugs
    needs: checkstyle
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    # spotbugs-maven-plugin 4.9+ requires JDK 11+ to run the plugin itself.
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Run SpotBugs
      run: mvn spotbugs:check

  test:
    name: Run Tests
    needs: spotbugs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Run Tests
      run: mvn test

  javadocs:
    name: Generate JavaDocs
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Generate JavaDocs
      run: mvn compile javadoc:javadoc

  package:
    name: Package Application
    needs: javadocs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Package
      run: mvn package -DskipTests

    - name: Verify JAR Manifest Main-Class
      run: |
        unzip -p target/cellular-automata-*.jar META-INF/MANIFEST.MF | grep "Main-Class: com.cellularautomata.app.Main"
