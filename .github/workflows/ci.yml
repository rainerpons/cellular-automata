name: CI

on:
  push:
    branches: [ master, "stage-*" ]
  pull_request:
    branches: [ master, "stage-*" ]

jobs:
  format:
    name: Check Formatting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Check Formatting
      run: mvn clean verify -Dcheckstyle.skip=true -Dspotbugs.skip=true -DskipTests=true

  checkstyle:
    name: Check Style
    needs: format
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Run Checkstyle
      run: mvn clean verify -Dfmt.skip=true -Dspotbugs.skip=true -DskipTests=true

  spotbugs:
    name: Run SpotBugs
    needs: checkstyle
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Run SpotBugs
      run: mvn clean verify -Dfmt.skip=true -Dcheckstyle.skip=true -DskipTests=true

  test:
    name: Run Tests
    needs: spotbugs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Run Tests
      run: mvn clean verify -Dfmt.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true

  javadocs:
    name: Generate JavaDocs
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Generate JavaDocs
      run: mvn clean verify javadoc:javadoc -Dfmt.skip=true -Dcheckstyle.skip=true -Dspotbugs.skip=true -DskipTests=true

  package:
    name: Package Application
    needs: javadocs
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Package
      run: mvn clean package -DskipTests=true

    - name: Verify JAR Manifest Main-Class
      run: |
        unzip -p target/cellular-automata-*.jar META-INF/MANIFEST.MF | grep "Main-Class: com.cellularautomata.app.Main"
